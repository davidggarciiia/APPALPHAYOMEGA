<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Panel del entrenador</title>
    <meta name="theme-color" content="#0E0D0B" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap"
    />
    <style>
      /* Una sola apariencia a propósito: la app es oscura (userInterfaceStyle: dark). */
      :root {
        color-scheme: dark;
        --fondo: #0e0d0b;
        --lateral: #151412;
        --tarjeta: #1a1916;
        --elevado: #1f1d19;
        --campo: #26231e;
        --borde: #2b2823;
        --borde-control: #6e675b;
        --texto: #f2ede1;
        --texto-2: #a39c8f;
        --parrafo: #d9d3c6;
        --oro: #ffc34c;
        --oro-grad: linear-gradient(135deg, #fff09a 0%, #ffcf52 38%, #ffb53c 72%, #e99a1f 100%);
        --sobre-oro: #16140f;
        --ambar: #f0b44c;
        --ambar-fondo: #2a2213;
        --verde: #5fb57a;
        --verde-fondo: #14231a;
        --rojo: #e06a5f;
        --rojo-fondo: #2a1614;
        --display: "Anton", "Impact", "Arial Narrow", sans-serif;
        --cuerpo: "Archivo", "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      body {
        background: var(--fondo);
        color: var(--texto);
        font-family: var(--cuerpo);
        font-size: 15px;
        line-height: 1.45;
        padding-inline: 16px;
        padding-block: 20px 40px;
        font-variant-numeric: tabular-nums;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--oro);
        outline-offset: 2px;
        border-radius: 6px;
      }
      ::selection {
        background: rgba(255, 195, 76, 0.35);
      }
      h1,
      h2,
      h3,
      p,
      ul,
      ol {
        margin: 0;
      }
      ul,
      ol {
        padding-left: 1.2em;
      }
      button {
        font: inherit;
        color: inherit;
      }

      /* ---- Barra del prototipo, fuera de la app ---- */
      .proto {
        max-width: 1440px;
        margin: 0 auto 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px 24px;
        align-items: center;
        justify-content: space-between;
      }
      .proto h1 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 26px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .proto p {
        color: var(--texto-2);
        font-size: 13px;
        max-width: 62ch;
      }
      .proto-controles {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      /* ---- Marco de la app: el ancho decide la navegación ---- */
      .marco {
        container-type: inline-size;
        max-width: 1440px;
        margin-inline: auto;
        border: 1px solid var(--borde);
        border-radius: 24px;
        overflow: clip;
        background: var(--fondo);
        transition: max-width 0.25s ease;
      }
      .marco.telefono {
        max-width: 390px;
      }
      @media (prefers-reduced-motion: reduce) {
        .marco {
          transition: none;
        }
      }
      .app {
        display: flex;
        flex-direction: column;
        min-height: 780px;
      }
      .lateral {
        display: none;
      }
      .contenido {
        flex: 1;
        padding: 20px 20px 28px;
        min-width: 0;
      }
      .dos-columnas,
      .constructor {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      .pestanas {
        position: sticky;
        bottom: 0;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        background: var(--lateral);
        border-top: 1px solid var(--borde);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pestanas a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 10px 4px 12px;
        font-size: 11px;
        font-weight: 600;
        color: var(--texto-2);
        text-decoration: none;
        min-height: 56px;
      }
      .pestanas a[aria-current="page"] {
        color: var(--oro);
      }
      .pestanas svg,
      .lateral svg {
        width: 22px;
        height: 22px;
        flex: none;
      }

      @container (min-width: 1024px) {
        .app {
          display: grid;
          grid-template-columns: 232px 1fr;
          min-height: 880px;
        }
        .lateral {
          display: flex;
          flex-direction: column;
          gap: 4px;
          background: var(--lateral);
          border-right: 1px solid var(--borde);
          padding: 28px 16px;
        }
        .pestanas {
          display: none;
        }
        .contenido {
          padding: 36px 48px 48px;
        }
        .solo-telefono {
          display: none !important;
        }
        .dos-columnas {
          display: grid;
          grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
          gap: 28px;
          align-items: start;
        }
        .constructor {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 340px;
          gap: 28px;
          align-items: start;
        }
        .panel-ejercicio {
          position: sticky;
          top: 16px;
        }
      }

      .marca {
        font-family: var(--display);
        font-size: 20px;
        letter-spacing: 0.06em;
        color: var(--oro);
        padding: 0 12px 20px;
      }
      .marca small {
        display: block;
        font-family: var(--cuerpo);
        font-size: 11px;
        letter-spacing: 0.3em;
        color: var(--texto-2);
        font-weight: 600;
      }
      .lateral a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        font-weight: 600;
        color: var(--texto-2);
        text-decoration: none;
        min-height: 44px;
      }
      .lateral a:hover {
        color: var(--texto);
      }
      .lateral a[aria-current="page"] {
        background: var(--elevado);
        color: var(--texto);
      }
      .lateral a[aria-current="page"] svg {
        color: var(--oro);
      }
      .lateral .separa {
        height: 1px;
        background: var(--borde);
        margin: 12px 8px;
      }
      .lateral .fase-mini {
        margin-left: auto;
        font-size: 11px;
        color: var(--texto-2);
        font-weight: 600;
      }

      /* ---- Tipografía de pantalla ---- */
      .encabezado {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 24px;
      }
      .encabezado h2 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 34px;
        line-height: 1.05;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        text-wrap: balance;
      }
      .encabezado .sub {
        color: var(--texto-2);
        margin-top: 6px;
      }
      .acciones {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      h3.seccion {
        font-size: 20px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      h4 {
        margin: 0 0 6px;
        font-size: 16px;
        font-weight: 700;
      }
      .tenue {
        color: var(--texto-2);
      }
      .pequeno {
        font-size: 13px;
      }
      .pila {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      .pila-corta {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* ---- Controles ---- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid transparent;
        background: none;
      }
      .btn-oro {
        background: var(--oro-grad);
        color: var(--sobre-oro);
      }
      .btn-oro:hover {
        filter: brightness(1.05);
      }
      .btn-borde {
        border-color: var(--borde-control);
        color: var(--texto);
      }
      .btn-borde:hover {
        background: var(--elevado);
      }
      .btn-texto {
        color: var(--oro);
        padding: 0 6px;
      }
      .btn-texto:hover {
        text-decoration: underline;
      }
      .btn-peq {
        min-height: 36px;
        font-size: 14px;
        padding: 0 12px;
        border-radius: 10px;
      }
      .conmutador {
        display: inline-flex;
        border: 1px solid var(--borde-control);
        border-radius: 12px;
        padding: 3px;
        gap: 2px;
      }
      .conmutador button {
        border: 0;
        background: none;
        padding: 8px 14px;
        border-radius: 9px;
        font-weight: 600;
        color: var(--texto-2);
        cursor: pointer;
        min-height: 38px;
      }
      .conmutador button[aria-pressed="true"] {
        background: var(--oro-grad);
        color: var(--sobre-oro);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 36px;
        padding: 0 14px;
        border-radius: 18px;
        background: var(--campo);
        border: 1px solid var(--borde);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        color: var(--texto);
      }
      .chip[aria-pressed="true"],
      .chip[aria-checked="true"] {
        background: var(--oro-grad);
        color: var(--sobre-oro);
        border-color: transparent;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid var(--borde-control);
        color: var(--texto-2);
        white-space: nowrap;
      }
      .pill::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .pill.sin-punto::before {
        display: none;
      }
      .pill.ambar {
        color: var(--ambar);
        border-color: rgba(240, 180, 76, 0.45);
        background: var(--ambar-fondo);
      }
      .pill.rojo {
        color: var(--rojo);
        border-color: rgba(224, 106, 95, 0.45);
        background: var(--rojo-fondo);
      }
      .pill.verde {
        color: var(--verde);
        border-color: rgba(95, 181, 122, 0.45);
        background: var(--verde-fondo);
      }
      .pill.oro {
        color: var(--oro);
        border-color: rgba(255, 195, 76, 0.4);
      }
      .fase {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--texto-2);
        border: 1px dashed var(--borde-control);
        border-radius: 6px;
        padding: 2px 8px;
      }

      .tarjeta {
        background: var(--tarjeta);
        border: 1px solid var(--borde);
        border-radius: 20px;
        padding: 20px;
      }
      .tarjeta.destacada {
        border-color: rgba(255, 195, 76, 0.28);
      }
      .fila {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 14px 0;
        border-bottom: 1px solid var(--borde);
      }
      .fila:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .fila:first-child {
        padding-top: 0;
      }
      .fila .crece {
        flex: 1;
        min-width: 0;
      }
      .fila .acciones {
        margin-top: 10px;
      }
      .punto {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-top: 6px;
        flex: none;
        background: var(--texto-2);
      }
      .punto.ambar {
        background: var(--ambar);
      }
      .punto.rojo {
        background: var(--rojo);
      }
      .punto.verde {
        background: var(--verde);
      }

      /* ---- Pestañas de pantalla ---- */
      .tabs {
        display: flex;
        gap: 22px;
        border-bottom: 1px solid var(--borde);
        margin-bottom: 24px;
        overflow-x: auto;
        scrollbar-width: thin;
      }
      .tabs a,
      .tabs button {
        flex: none;
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 10px 0 12px;
        font-weight: 600;
        color: var(--texto-2);
        text-decoration: none;
        cursor: pointer;
        min-height: 44px;
      }
      .tabs [aria-selected="true"] {
        color: var(--texto);
        font-weight: 700;
        border-bottom-color: var(--oro);
      }

      /* ---- Tablas ---- */
      .tabla-scroll {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      caption {
        text-align: left;
        color: var(--texto-2);
        font-size: 13px;
        padding-bottom: 8px;
      }
      th {
        text-align: left;
        font-size: 13px;
        font-weight: 600;
        color: var(--texto-2);
        padding: 8px 12px 10px 0;
        border-bottom: 1px solid var(--borde);
        white-space: nowrap;
      }
      td {
        padding: 12px 12px 12px 0;
        border-bottom: 1px solid var(--borde);
        vertical-align: top;
      }
      tbody tr:last-child td,
      tbody tr:last-child th {
        border-bottom: 0;
      }
      tbody th {
        vertical-align: top;
        color: var(--texto);
        font-size: 14px;
        font-weight: 600;
        white-space: normal;
        padding-top: 12px;
      }
      .num {
        text-align: right;
      }
      .series-hechas {
        display: flex;
        flex-direction: column;
        gap: 2px;
        white-space: nowrap;
      }
      .aviso-texto {
        color: var(--ambar);
        font-weight: 600;
      }
      .sube {
        color: var(--oro);
        font-weight: 700;
      }

      /* ---- Constructor ---- */
      .seccion-dia {
        padding: 16px 0;
        border-top: 1px solid var(--borde);
      }
      .seccion-dia:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .seccion-dia header {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .seccion-dia h4 {
        margin: 0;
      }
      .lista-dosis {
        display: grid;
        gap: 6px;
        list-style: none;
        padding: 0;
      }
      .lista-dosis li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--parrafo);
      }
      .lista-dosis li > span:last-child {
        color: var(--texto-2);
        text-align: right;
      }
      .fila-ejercicio button {
        background: none;
        border: 0;
        padding: 0;
        text-align: left;
        font-weight: 600;
        cursor: pointer;
        color: var(--texto);
      }
      .fila-ejercicio button:hover {
        color: var(--oro);
      }
      .fila-ejercicio[aria-current="true"] td,
      .fila-ejercicio[aria-current="true"] th {
        background: var(--elevado);
      }
      .fila-ejercicio[aria-current="true"] button {
        color: var(--oro);
      }
      .campo {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .campo label,
      .campo .etiqueta {
        font-size: 13px;
        color: var(--texto-2);
        font-weight: 600;
      }
      .campo input,
      .campo textarea,
      .campo select {
        background: var(--campo);
        border: 1px solid var(--borde-control);
        border-radius: 10px;
        color: var(--texto);
        font: inherit;
        padding: 10px 12px;
        min-height: 44px;
      }
      .campo textarea {
        min-height: 88px;
        resize: vertical;
      }
      .rejilla-campos {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .fases {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .fase-tarjeta {
        border: 1px solid var(--borde);
        border-radius: 16px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .fase-tarjeta[aria-current="step"] {
        border-color: var(--oro);
      }
      .fase-tarjeta .semanas {
        font-size: 13px;
        color: var(--texto-2);
        font-weight: 600;
      }
      .fase-tarjeta strong {
        font-size: 17px;
      }

      /* ---- Cifras ---- */
      .cifras {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }
      .cifra {
        border: 1px solid var(--borde);
        border-radius: 16px;
        padding: 14px;
      }
      .cifra .valor {
        font-size: 24px;
        font-weight: 700;
        display: block;
        margin-top: 2px;
      }
      .cifra .nota {
        font-size: 13px;
        color: var(--texto-2);
      }
      .barra-macros {
        display: flex;
        height: 12px;
        border-radius: 6px;
        overflow: hidden;
        margin: 12px 0;
        gap: 2px;
      }
      .barra-macros span:nth-child(1) {
        background: var(--oro);
      }
      .barra-macros span:nth-child(2) {
        background: var(--verde);
      }
      .barra-macros span:nth-child(3) {
        background: #f28c38;
      }

      /* ---- Vista del cliente ---- */
      .telefonos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }
      .telefono-maqueta {
        border: 1px solid var(--borde);
        border-radius: 28px;
        padding: 20px 18px 22px;
        background: radial-gradient(420px 360px at 85% 0%, #3a2a0c, var(--fondo) 62%);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .telefono-maqueta h3 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 28px;
        text-transform: uppercase;
      }
      .pregunta {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .pregunta > span {
        font-weight: 600;
        font-size: 14px;
      }
      .escala {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .escala button {
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid var(--borde);
        background: var(--campo);
        font-weight: 700;
        cursor: pointer;
      }
      .escala button[aria-checked="true"] {
        background: var(--oro-grad);
        color: var(--sobre-oro);
        border-color: transparent;
      }
      .extremos {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--texto-2);
      }
      .deslizador {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .deslizador input {
        accent-color: var(--oro);
        width: 100%;
      }
      .recomendacion {
        border-radius: 16px;
        padding: 14px;
        background: var(--ambar-fondo);
        border: 1px solid rgba(240, 180, 76, 0.45);
      }
      .recomendacion strong {
        color: var(--ambar);
      }
      .tabla-series input {
        width: 56px;
        background: var(--campo);
        border: 1px solid var(--borde-control);
        border-radius: 8px;
        color: var(--texto);
        font: inherit;
        padding: 8px;
        min-height: 40px;
        text-align: center;
      }
      .tabla-series input::placeholder {
        color: #948d80;
      }
      .tabla-series td,
      .tabla-series th {
        padding-right: 8px;
      }
      .hecha {
        color: var(--verde);
        font-weight: 700;
      }

      .aviso-proto {
        border: 1px dashed var(--borde-control);
        border-radius: 16px;
        padding: 16px;
        color: var(--parrafo);
      }
      .rejilla-mas {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }
      .rejilla-mas a {
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-decoration: none;
      }
      .rejilla-mas a:hover {
        border-color: var(--borde-control);
      }
      .tarjeta.enlace {
        display: block;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header class="proto">
      <div>
        <h1>Panel del entrenador · prototipo</h1>
        <p>
          Maqueta navegable para revisar antes de programar. Todos los clientes y cifras son
          inventados. Las etiquetas «Fase» dicen en qué entrega del plan llega cada parte.
        </p>
      </div>
      <div class="proto-controles">
        <div class="conmutador" role="group" aria-label="Ancho de la maqueta">
          <button type="button" id="ver-telefono" aria-pressed="false">Teléfono</button>
          <button type="button" id="ver-escritorio" aria-pressed="true">Escritorio</button>
        </div>

        <div class="deslizador"><label for="c-int"><strong>Intensidad:</strong> 4 de 10</label><input id="c-int" type="range" min="0" max="10" value="4" /></div>

      const PANTALLAS = {
        hoy: pantallaHoy,
        clientes: pantallaClientes,
        ficha: pantallaFicha,
        constructor: pantallaConstructor,
        asignar: pantallaAsignar,
        rutinas: pantallaRutinas,
        ejercicios: pantallaEjercicios,
        ejercicio: pantallaEjercicio,
        guia: pantallaGuia,
        mas: pantallaMas,
        pendiente: pantallaPendiente,
        cliente: pantallaCliente,
      }

      // ---------- Navegación ----------
      function seccionDe(pantalla, sub) {
        if (pantalla === "ficha" || pantalla === "constructor" || pantalla === "asignar")
          return "clientes"
        if (pantalla === "ejercicio") return "ejercicios"
        if (pantalla === "pendiente") return sub
        if (pantalla === "cliente") return null
        return pantalla
      }

      function pintarNavegacion(seccion) {
        document.getElementById("nav-lateral").innerHTML = SECCIONES.map((s) =>
          s.separa
            ? '<div class="separa" role="separator"></div>'
            : `<a href="#${PENDIENTES.includes(s.clave) ? "pendiente-" + s.clave : s.clave}"${s.clave === seccion ? ' aria-current="page"' : ""}>${icono(s.clave)}<span>${s.texto}</span>${s.fase ? `<span class="fase-mini">${s.fase}</span>` : ""}</a>`,
        ).join("")
        const enMas = seccion === "mas" || seccion === "guia" || PENDIENTES.includes(seccion)
        document.getElementById("nav-pestanas").innerHTML = PESTANAS.map((clave) => {
          const activa = clave === "mas" ? enMas : clave === seccion
          const texto = {
            hoy: "Hoy",
            clientes: "Clientes",
            rutinas: "Rutinas",
            ejercicios: "Ejercicios",
            mas: "Más",
          }[clave]
          return `<a href="#${clave}"${activa ? ' aria-current="page"' : ""}>${icono(clave)}<span>${texto}</span></a>`
        }).join("")
      }

      function leerRuta() {
        const h = decodeURIComponent(location.hash.slice(1)) || "hoy"
        const i = h.indexOf("-")
        return i < 0 ? [h, null] : [h.slice(0, i), h.slice(i + 1)]
      }

      function pintar(desdeNavegacion) {
        const [pantalla, sub] = leerRuta()
        const clave = PANTALLAS[pantalla] ? pantalla : "hoy"
        const contenido = document.getElementById("contenido")
        contenido.innerHTML = PANTALLAS[clave](sub)
        pintarNavegacion(seccionDe(clave, sub))
        if (desdeNavegacion) contenido.focus({ preventScroll: true })
      }

      window.addEventListener("hashchange", () => {
        pintar(true)
        document.getElementById("marco").scrollIntoView({ block: "start" })
      })

      document.addEventListener("click", (evento) => {
        const dia = evento.target.closest("[data-dia]")
        if (dia) {
          estado.dia = dia.dataset.dia
          estado.ejercicio = 0
          pintar(false)
          document.querySelector(`[data-dia="${estado.dia}"]`)?.focus()
          return
        }
        const ejercicio = evento.target.closest("[data-ejercicio]")
        if (ejercicio) {
          estado.ejercicio = Number(ejercicio.dataset.ejercicio)
          pintar(false)
          document.querySelector(`[data-ejercicio="${estado.ejercicio}"]`)?.focus()
          return
        }
        // Chips y escalas de ejemplo: marcan su selección para que la maqueta se sienta viva.
        const opcion = evento.target.closest('[role="radio"]')
        if (opcion) {
          opcion.parentElement
            .querySelectorAll('[role="radio"]')
            .forEach((b) => b.setAttribute("aria-checked", String(b === opcion)))
          return
        }
        const casilla = evento.target.closest('[role="checkbox"]')
        if (casilla) {
          casilla.setAttribute(
            "aria-checked",
            String(casilla.getAttribute("aria-checked") !== "true"),
          )
          return
        }
        const chip = evento.target.closest(".chips[role=group] .chip[aria-pressed]")
        if (chip) {
          chip.parentElement
            .querySelectorAll("[aria-pressed]")
            .forEach((b) => b.setAttribute("aria-pressed", String(b === chip)))
        }
      })

      // ---------- Ancho de la maqueta ----------
      const marco = document.getElementById("marco")
      const botonTelefono = document.getElementById("ver-telefono")
      const botonEscritorio = document.getElementById("ver-escritorio")
      function fijarAncho(telefono) {
        marco.classList.toggle("telefono", telefono)
        botonTelefono.setAttribute("aria-pressed", String(telefono))
        botonEscritorio.setAttribute("aria-pressed", String(!telefono))
        try {
          localStorage.setItem("proto-ancho", telefono ? "telefono" : "escritorio")
        } catch (_) {
          /* Sin almacenamiento, la maqueta sigue funcionando con el ancho por defecto. */
        }
      }
      botonTelefono.addEventListener("click", () => fijarAncho(true))
      botonEscritorio.addEventListener("click", () => fijarAncho(false))
      try {
        if (localStorage.getItem("proto-ancho") === "telefono") fijarAncho(true)
      } catch (_) {
        /* Igual que arriba. */
      }

      pintar(false)
    </script>
